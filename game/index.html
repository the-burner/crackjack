<script>var HTMFILES={"frmBet.htm":"<h2>Betting Strategies</h2>\r\n\r\n<p>This screen is used to set the table of bets that you can make.  If you are a card counter, it also allows you to set when you will make each  bet.</p>\r\n<h3>Warning on Betting Error</h3>\r\n<p>This option is only used for card counters. When on, a new  option will appear and the count column in the table will list count values. To  avoid a betting error, you must bet the amount that corresponds with the count  in the table.</p>\r\n<h3>Chip Value</h3>\r\n<p>Set the value of the smallest chip.</p>\r\n<h3>Number of bets</h3>\r\n<p>This is the number of rows in the table. There can be 18  different bets.</p>\r\n<h3>Minimum bet count</h3>\r\n<p>If you are counting, set this option to the lowest count in the  table.</p>\r\n<h3>The Table</h3>\r\n<p>Amounts in the table are in chips. So, if the chip size is  $100, and the bet is 5, the bet is $500. To change a value in the table, tap on  the value. A set of buttons will be displayed with various numbers of chips. Tap  on a value to change a row in the table. If you want to bet multiple hands, tap  on the upper table first. So, to bet three hands of six chips each, tap on 3x  then 6. With a chip size of $100, this will represent three hands of $600. When  you are playing the game, the betting screen will display a button labelled  3x$600. Tap to bet accordingly. If you have set the options such that you don&rsquo;t  have three seats available, then it will bet as many seats as it can. </p>\r\n<h3>Custom Bet</h3>\r\n<p>Tap this button to set a value not available in the provided  bets.</p>","frmBetSelect.htm":"<h2>Betting Strategies</h2>\r\n\r\n<p>This screen is used to set the table of bets that you can make.  If you are a card counter, it also allows you to set when you will make each  bet.</p>\r\n<h3>Warning on Betting Error</h3>\r\n<p>This option is only used for card counters. When on, a new  option will appear and the count column in the table will list count values. To  avoid a betting error, you must bet the amount that corresponds with the count  in the table.</p>\r\n<h3>Chip Value</h3>\r\n<p>Set the value of the smallest chip.</p>\r\n<h3>Number of bets</h3>\r\n<p>This is the number of rows in the table. There can be 18  different bets.</p>\r\n<h3>Minimum bet count</h3>\r\n<p>If you are counting, set this option to the lowest count in the  table.</p>\r\n<h3>The Table</h3>\r\n<p>Amounts in the table are in chips. So, if the chip size is  $100, and the bet is 5, the bet is $500. To change a value in the table, tap on  the value. A set of buttons will be displayed with various numbers of chips. Tap  on a value to change a row in the table. If you want to bet multiple hands, tap  on the upper table first. So, to bet three hands of six chips each, tap on 3x  then 6. With a chip size of $100, this will represent three hands of $600. When  you are playing the game, the betting screen will display a button labelled  3x$600. Tap to bet accordingly. If you have set the options such that you don&rsquo;t  have three seats available, then it will bet as many seats as it can. </p>\r\n<h3>Custom Bet</h3>\r\n<p>Tap this button to set a value not available in the provided  bets.</p>","frmDB.htm":"<h2>Casino Database</h2>\r\n\r\n<h3>CBJN</h3>\r\n<p>The Current Blackjack News database contains the rules and  playing conditions for U.S. and Canadian casinos. Subscribers receive updates  on&nbsp; a monthly basis. A 2015 version of  the database has been included in this app. Each month CBJN subscribers receive a link to the PDF of that month's CBJN. At the end of that link is a ? followed by a number. Enter the number in the CBJN id field and click Update to load the latest month's data.</p>\r\n<h3>Search</h3>\r\n<p>Once you have loaded the database, you can enter a search  term and locate games. The search term can contain a casino name, city, or  state. Partial text can be entered. Searching will result in a list of games.  For each game, the casino, location, decks, house edge, min and max bets, and  rules are listed. </p>\r\n<h3>Details</h3>\r\n<p>Click a game in the list for further details. From the  details screen, you can also load the rules into the game.</p>\r\n<h3>Rules Key</h3>\r\n<p>all: Lose all on doubles or splits if dealer has BJ.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  A8: The only splits allowed are A-A and 8-8.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  burn20: See  www.ukcasinotablegames.info/blackjackburn20.html&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  col: Casino collects a fee per hand, generally at least  1%.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  cs: Casino surrender. Player with a two-card twenty can  accept a half win against a 10, if the deale<br />\r\n  csm: Continuous-shuffle machine.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  da: Double down on any two or more cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  dab: Double attack blackjack. All 10s removed from deck,  player can double bet after seeing one deal<br />\r\n  dba: Double on any number of cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  ddd: Redouble, i.e. double again after doubling and getting  a card.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  ddr: Double down rescue, ie. surrender after doubling  down.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  de: Double exposure. Dealer's two cards both face up. Dealer  wins all ties except BJ against BJ.&nbsp;&nbsp;&nbsp; <br />\r\n  ds: Double down after splitting.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  dsa: Double down after splitting aces.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  ds10: Double down on ten or eleven after splitting.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  d3: Double down on first three cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  d4: Double down on first four or fewer cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  d8: Double down only on two-card eight or more, including  soft totals.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  d9: Double down only on two-card nine or more.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  d10: Double down only on two-card ten or more.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  d11: Double down only on two-card eleven.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  enhc: &acirc;&euro;&oelig;European no hole card.&acirc;&euro;&#157;&nbsp; Dealer does not take a second card until  after players act. Doub<br />\r\n  es: Early surrender.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  es10: Early surrender against 10, late surrender against  others.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  extreme: Extreme 21. See wizardofodds.com.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  fak1, fak2: Games using six or eight decks that can be  mistaken for single- or double-deckers.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  freebet: Dealer total of 22 pushes all unbusted player hands  except pays 3:2 on player naturals. Pla<br />\r\n  hide: Dealer shows player cards only when necessary to  decide winner.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  highhand: Players must contribute to a side pot from which  the house takes 5%.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  hitie: High Tie Bonus Bet: The payouts are based on the  player's first two cards. A suited pair pays<br />\r\n  hsa: Hit after splitting aces.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  h17: Dealer hits soft seventeen.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  KB:King's Bounty sidebet. Payoffs: 4/6/9/20/30/100/1000 for  any 20/K-K/suited20/matched20/suited K-K<br />\r\n  LL6:Lucky Ladies sidebet. Payoffs: 3/6/9/25/250 for any  20/suited20/matched 20/Q-Q/Q-Q &amp; dealer BJ. <br />\r\n  LL7:Lucky Ladies sidebet. Payoffs: 3/7/9/25/400 for any  20/suited20/matched 20/Q-Q/Q-Q &amp; dealer BJ. <br />\r\n  LL9: Lucky Ladies sidebet. Payoffs: 4/9/19/125/1000 for any  20/suited 20/matched 20/Qh-Qh/Qh-Qh &amp; dl<br />\r\n  LL10: Lucky Ladies sidebet. Payoffs: 4/10/25/200/1000 for  any 20/suited 20/matched 20/Qh-Qh/Qh-Qh &amp; <br />\r\n  ls: Late surrender.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  lsn: Late surrender on any number of cards, including after  splitting.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  lsnxa: Late surrender on any number of cards except no  surrender against ace.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  lsxa: Late surrender except no surrender against ace.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  ma: Multiple-action blackjack.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  min: Mid-entry restricted to table minimum.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nc: No cards; i.e. digital blackjack.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  nch: No chips; i.e. digital chip stacks&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nhsa: No drawing to split aces (Spanish)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  ni: No insurance.&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  nm: No mid-game entry.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nmm: No mid-game entry and no mid-game spreading to multiple  hands.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  nmo: No mid-game entry on request.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nms: Mid-game: no sitting out hands, and if you drop from  two hands to one you cannot go back to two<br />\r\n  nobj: If dealer has 10 and ace, the hand plays as an  ordinary twenty-one and not a BJ.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  No Bust: If you and the dealer both bust, and the dealer  busts with a higher total, you push instead<br />\r\n  nrs: No resplits.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  nrs10: No resplits of any 10-count cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nsa: No splits of aces.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nsjq: No splits of unlike 10-count cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  ns10: No splits of any 10-count cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  nsxa: No splits except you can split aces. (&acirc;&euro;&oelig;Multiple  Action&acirc;&euro;&#157;)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  ou25: Side bets on whether your first two cards are over or  under 13. The 25 means max bet of $25.&nbsp; <br />\r\n  pb: Player banked.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  pk: Dealer looks at the index of the hole card under a  10.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; es (da,  ds, dsa, hsa, lsn, rsa, sura, 21d, 21w, <br />\r\n  shoe: Cards dealt from a shoe. Used only for single and  double deck, which more commonly are dealt w<br />\r\n  Single21: rules include 1:1,21w,da,sura,6; suited BJs pay  3:2, splits allowed after hitting.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  snoop: An in-table device tracks cards and betting; i.e.  i-Table or MindPlay.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  spa32: Split aces that draw for 2 card 21 pay 3:2.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  Spanish: Spanish 21 is played with a short pack &acirc;&euro;&rdquo; 10s are  removed from each regular deck, leaving <br />\r\n  streak: A sidebet that pays if you win consecutive hands.  Most common payout: 2 wins pays 3:1, 3 win<br />\r\n  sura: Surrender anytime, including after hitting, doubling,  or splitting.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  swhands: Switch Hands Blackjack. Pay $1 &acirc;&euro;&oelig;ante&acirc;&euro;&#157; for every  $5 bet for the option (before hitting) <br />\r\n  switch: Blackjack Switch. See www.blackjackswitch.com.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  switch6: Blackjack Switch in which a switched A/10 is  treated as a drawn 21 and will push against a <br />\r\n  s17: Dealer stands on soft seventeen.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  toke: Dealers keep their own tokes.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  tu: Player may triple down on 9, 10 or 11.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  tu10: Player may triple down on 10 or 11.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  ur: Unlimited resplits of non-aces.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  1spot: Players allowed to bet only one spot.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  1:1: BJ pays even money.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  3up: Play one hand against three dealer upcards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  3:2: BJs pay 3:2. This is also the default if no BJ payout  is listed.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  5: Player's winning five-card twenty-one pays double.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  6: Player's six-card unbusted hand wins automatically, even  if the dealer has 10 up and ace in hole.<br />\r\n  6:5: BJs pay 6:5.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  7:5: BJs pay 7:5.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  21d: Diamond BJ pays 2:1. 1/16 of BJs are in diamonds.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  21p: If dealer has BJ with 10 up, you push with twenty-one  in any number of cards.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  21s: Suited BJs pay 2:1. 1/4 of BJs are suited.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  21t: Tied BJ pushes (at double exposure).&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r\n  21w: Tied BJ wins.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n  22p: If dealer gets 22, players push instead of win.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br />\r\n&nbsp;&nbsp; &nbsp;</p>\r\n<h3>&nbsp;</h3>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>","frmImport.htm":"<h2>Import Strategy\r\n  </h2>\r\n<p>Strategies supported by BJV can be very complex. For example,  the Spanish 21 strategy, supplied by the Wizard of Odds, has rules like Hit if  five or more cards or a 678 is possible. Strategies can also include separate  tables for different rules. Inputting a complex strategy on a touchscreen would  be extremely difficult. So, a feature has been added to import strategies from  Casino V&eacute;rit&eacute; Blackjack. This provides the ability to create a complex strategy  on a PC and download it to your mobile device. If you do not have a CV  Blackjack license, you can use the free demo at <a href=\"http://www.qfit.com/downloads.htm\" target=\"_blank\">www.qfit.com/downloads.htm</a>. The  strategy creation and export functions work in the demo.</p>\r\n<p>  To Export a strategy in CV Blackjack, click on Strategies then  Playing Strategies Simple. Select a strategy. Then hit Export Strategy. (If the  button is not there, download the latest update.) You will be presented with a  number. Enter the number in the Import Strategy screen and click Import. Click  Exit, then Select a Strategy, and you will see your strategy in the list.  Multiple strategies can be imported.<br />\r\n</p>","frmMain.htm":"<h2>Blackjack Verite - Games</h2>\r\n<p>BJV Games is the mobile version of  the Casino Verite Blackjack practice play module. CV Blackjack has long been  the standard training tool in the Blackjack world, and is mentioned in 25  books. This is serious Blackjack software - not the toy apps you find in app  stores. Blackjack Verite Drills is the partner app that allows you to focus on  specific skills.</a></p>\r\n<p>You will see a Help  button in the upper right of every screen. Tap this button for help with that  screen. The Help screen displays a PDF button in the same spot. The PDF button  will display a detailed PDF document. The Blackjack rules are not explained  here. They can be found all over the web. For an in-depth look at the subject,  we have a free 540 page book on Blackjack at <a href=\"http://www.qfit.com/book\">www.qfit.com/book</a>. We also operate the most active Blackjack  forum at <a href=\"http://www.blackjacktheforum.com\">www.blackjacktheforum.com</a>.</p>\r\n<h3>Home Screen</h3>\r\n<p><strong>Options</strong><br />\r\nTap on Options to navigate to the various option screens or  launch the game</p>\r\n<p><strong>Reset Defaults</strong><br />\r\n  This app has thousands of settings. Reset will change them all  back to the defaults, and remove any imported custom strategies or games.</p>\r\n<p><strong>Screen Problems</strong><br />\r\n  Hit this button if there are any problems with the screen  displays.</p>","frmOpts0.htm":"<h2>Options</h2>\r\n\r\n<p>Tap the buttons to enter the various option screens. Tap  Launch to enter the game.</p>\r\n","frmOpts1.htm":"<h2>Basic Setup</h2>\r\n\r\n<h3>Seats</h3>\r\n<p>First, configure the table. A table can have 1, 2, 4 or 6 seats  using a tablet. In portrait orientation, only one or two seats are allowed.  Phones can only run the games in portrait mode. You will see a bar with the  numbers #6 through #1 representing the seats. If a seat is colored blue, then  the computer will play in that seat. If it is colored white, the seat is  available for you to play. You can play from one to six seats at once. You are not  competing with computer players. The point of computer players is as a  distraction for basic strategy players and as additional cards that card  counters must count. Tap on a seat button to change between blue and white.</p>\r\n<h3>Decks</h3>\r\n<p>Select one to eight decks.</p>\r\n<h3>Shuffle</h3>\r\n<p>You can set the game to shuffle after a cut card (typical with  two to eight decks) or after a fixed number of rounds (common with single-deck.)  If set to cut card, tap the Shuffle point to enter the number of cards AFTER  the cut card. If set to rounds, tap and enter the number of rounds before a shuffle.  Typically, the number of rounds plus the number of players equals around six.  But, this varies by casino.</p>\r\n<h3>Burn cards</h3>\r\n<p>After a shuffle, the casino removes zero to five of the cards  from the top and discards them.</p>\r\n<h3>Starting bankroll</h3>\r\n<p>Tap to change your bankroll. You can reset the bankroll by tapping  Refresh Bankroll, or before any bet. The bankroll will be automatically reset,  or remembered, whenever you start the game according to an option on the  Speeds/Mechanics screen.</p>\r\n","frmOpts2.htm":"<h2>Rule Variations</h2>\r\n\r\n<ul>\r\n  <li><strong>Double down on three  cards</strong> - This rare option allows doubling down on two or three cards.</li>\r\n  <li><strong>Double on any number  of cards</strong> - This rare option allows doubling down in almost any  circumstance. The advantage is very high at about .23%.</li>\r\n  <li><strong>Redouble - </strong>This  option exists in many Spanish 21 games. After you double down, you get another  chance to double your bet again, twice. So if you have a $10 bet and an eight.  You can double to $20. If you draw an Ace, you can double to $40. Draw another  and you can double to $80.</li>\r\n  <li><strong>Triple Down </strong>-  A Russian rule allowing a larger DD bet.</li>\r\n  <li><strong>Hit after Double  Down</strong> - This rule does not actually exist. However, in some casinos  Surrender after Double Down does. Inexperienced dealers will sometimes allow  you to Hit after a Double in these casinos. This is very valuable. When this  rule is on, the app will wait for you to signal a hit or stand after doubling.</li>\r\n  <li><strong>Double Down Rescue</strong> - A new rule that allows a Surrender even after you have doubled down. </li>\r\n  <li><strong>Resplit to three  hands</strong> - If you split a pair into two hands, and draw another  matching card, most casinos allow a resplit to three hands. This option allows  Resplit to three hands only. This option does NOT affect� resplitting of Aces.</li>\r\n  <li><strong>Resplit to four  hands</strong> - This very common option allows splitting pairs in one hand  up to three times. As a result, up to four hands can be created from one. This  option does NOT affect resplitting of Aces. </li>\r\n  <li><strong>Double after Ace  Split </strong>- Rare rule that allows you to double down after splitting  aces, but not to hit.</li>\r\n  <li><strong>Resplit Aces</strong> - Adding this option allows resplitting of a pair of Aces to the above option.  This option is not common, but more common than people think. It is often found  in larger Las Vegas Strip casinos that also offer surrender. It is important to  check since the rule is valuable(about 0.1% advantage)� in shoe games. (There is little value in single  deck games as it is rare that you will get three of the four Aces.)</li>\r\n  <li><strong>Multiple draw after  split Aces</strong> - Most casinos will only allow one card drawn to each  split hand after splitting Aces. This option allows additional draws. The rule  adds another .1% advantage in shoe games. This rule is quite common in Internet  casinos, but not common in land casinos. </li>\r\n  <li><strong>Split tens must be  same value</strong> - In most casinos, tens, Jacks, Queens and Kings all  count as ten and can be considered the same for splitting rules. In other  words, you can split a Jack and a King. A few casinos demand that the cards be  exact pairs.</li>\r\n  <li><strong>No Ace Splits</strong> - When this option is set, you cannot split Aces. This option is fairly rare  and should be avoided.</li>\r\n  <li><strong>No 4, 5, or Ten  Splits - </strong>This rule is common in the UK. Fours, fives and tens can  never be split.</li>\r\n</ul>","frmOpts3.htm":"<h2>Unusual Games</h2>\r\n\r\n<p>The number of variations to Blackjack has expanded greatly  over the last several years as the ever-increasing number of casinos compete  for customers. Some of these games have unusual rules and some have side bets.  With side bets, you have the option to make a side bet that something unusual  will happen. In some games, you can select one of two side bets. Side bets  cannot normally exceed the size of the original bet and sometimes are limited  to $1 when the payoffs are very high. <br />\r\n  Due to the difficulty in keeping up with all the new games,  this section consists of a library of specialty games in a scrollable list. New  games created by anyone can be imported into the list. See the Import function  later. To select a game, tap the list, scroll and select. To understand how to  make side bets, read the description of Over/Under 13 below:</p>\r\n<h3>Library Games</h3>\r\n<ul>\r\n  <li><strong>Over/Under  13</strong> - This option, adds a side bet to the game. When the bet  selection screen comes up, you can tap on Side Bets and see two new buttons, O  and U. You can bet that your first two cards will total 14 or greater by tapping  &quot;O&quot; and then the amount to bet, or you may bet that the first two  cards are under 13 by betting &quot;U&quot;. The house wins all totals of 13.  Aces count as one for this side bet only. The bets are resolved immediately  after the dealer up card is shown. If you win, the bet will be doubled and then  moved to your chip box. You cannot bet against yourself. Your selection (O or  U) will be remembered and you will not need to re-tap the O or U before making  a new side bet.</li>\r\n  <li> <strong>Red/Black</strong> - This side  bet is very like Over/Under 13 except that you bet on whether the dealer up  card is red or black by placing an &quot;R&quot; or &quot;B&rdquo; bet. The dealer  wins on all twos. Play is the same as with Over/Under 13 described above.</li>\r\n  <li> <strong>Royal Match</strong> - Available  in a few casinos, this option allows a different side bet on the first two  cards. You can bet that your first two cards are in the same suit. If they are,  the bet pays 3:1. If they are the Queen and King of the same suit, this is a  Royal Match which pays 10:1. The bet is resolved as soon as the dealer up card  is shown and any winnings are immediately moved to your chip box.  </li>\r\n  <li><strong>Super 7's</strong> - This option  exists in a few casinos with a few variations. The version included here  appears to be the most common. You can make a side bet of only $1 that you will  be dealt consecutive sevens.� If you are  dealt two sevens, you will be dealt a third card, even if the dealer has a  Blackjack. If you split sevens, you will be paid for only the first two sevens.  Payoff occurs after the second or third card is dealt according to the  following table: \r\n    <ul>\r\n      <li>        First  card any 7:�$3</li>\r\n      <li> First  two cards any 7's: $50</li>\r\n      <li> First  two cards 7's same suit:� $100<br />\r\n        First  three cards any 7's: $500</li>\r\n      <li> First  three cards 7's same suit: $5000</li>\r\n    </ul>\r\n  </li>\r\n  <li> <strong>Super  Fun 21</strong> - This is a variation of single deck BJ. You may hit and  double split Aces, double or surrender on any number of cards, and Surrender  after doubling. Several bonuses exist: player 21 with five or more cards pays  2:1, player hand of 20 or less with six cards wins, player BJ always wins and a  diamond BJ pays 2:1. However, all other BJs pay even money. This last rule is  very expensive. The game requires a quite different strategy to play correctly.  The game requires a quite different strategy to play correctly. A strategy  devised by Michael Shackleford (www.thewizardofodds.com) has been included.</li>\r\n  <li> <strong>Spanish 21</strong> - This BJ variation has been around  for several years and �has become fairly  popular. Six or eight decks are used. A player 21 always wins, player BJ always  wins, player can hit and double split Aces, may surrender after doubling and  double any number of cards. Bonuses include: 678 pays 3:2, 2:1 if same suit and  3:1 in Spades; suited 777 against a dealer 7 pays $1,000. However, all tens are  removed from the deck. This last rule is very expensive. The game requires a  quite different strategy to play correctly. A strategy devised by Michael  Shackleford (www.thewizardofodds.com) and Katarina Walker has been included.</li>\r\n  <li> <strong>Lucky Ladies </strong>- This  variation includes a side bet that you will receive in the first two cards: any  20, suited 20, matched 20, pair of Heart Queens or pair of Heart Queens with a  dealer BJ. Payoffs can be changed by the player.</li>\r\n  <li><strong>Blackjack Switch </strong>- In  this game, included by permission of the designer, you must play two hands with  equal bets. You are allowed to switch the second cards between the two hands.  So, if one hand has two Aces and the other two Tens, you can switch the cards  and end up with two 21s. However, Blackjacks pay even money and a dealer total  of 22 will push against any player total of 21 or less. A player blackjack will  still beat a dealer 22. To indicate a desire to switch cards, tab the Switch  button.</li>\r\n  <li><strong>Double Exposure</strong> - In  this unusual game, both dealer cards are dealt face up. Obviously, this gives  the player an enormous advantage. To counteract this advantage, the &quot;No  Blackjack bonus&quot; and &quot;Dealer wins ties&quot; options are  automatically turned on. You can turn them back off if you wish. Also, there is  no Insurance bet in Double Exposure. This is a very different game with  entirely different playing strategies. I would not suggest this option in a  casino if you have not fully studied the game. A sample Double Exposure  strategy is included thanks to Mike Shackleford, the Wizard of Odds.\r\n  </li>\r\n  <li> <strong>21+3</strong> - Bet the first two  cards and the dealer up card make a Poker hand</li>\r\n  <li> <strong>Bonanza BJ </strong>- Bet on a 20  in the first two cards and a dealer Ten up.</li>\r\n  <li> <strong>Dare any Pair </strong>- Bet the  first two player cards are a Pair.</li>\r\n  <li> <strong>Lucky Ladies</strong> - A popular  new rule betting on the first two cards being a pair of Queens or 20. Can be  beaten.</li>\r\n  <li> <strong>Lucky Lucky</strong> - A side bet  with a complex payoff on 678, 777, 21, 20 or 19 suited or unsuited. <br />\r\n    <strong>Pair Square</strong> - Bet first  two cards are of the same rank</li>\r\n  <li> <strong>Perfect Pairs</strong> - Bet the  first two cards are a Pair with various payoffs.</li>\r\n  <li> <strong>Sweet 16</strong> - Bet the first  two cards are a low pair, Ace or 16-21 points.&nbsp;</li>\r\n</ul>\r\n<h3>Import</h3>\r\n<p>These game definitions were created using� the Windows Casino Verite Blackjack program.  The definition screens are not included in the app as they are extremely  flexible, and therefore very complex for a touch screen. However, custom side  bets and bonuses can be defined in Casino Verite Blackjack on a Windows PC and  exported to this app. They can also be shared with other users. If you do not  have a license, the free demo version will also allow exports. In Casino  Verite, tap on Options, Settings, Unusual Games. Select a custom game. Then hit  Export. (If the button is not there, download the latest update.) You will be  presented with a number. Enter the number by tapping on &ldquo;Enter text here&rdquo; and tap  Import. You will see your game in the list. Multiple games can be imported. You  do not need to connect the device to the PC. The export and import are separate  operations using the Internet.</p>\r\n","frmOpts4.htm":"<h2>Speeds/Mechanics</h2>\r\n\r\n<h3>Speeds</h3>\r\n<p>Default speeds are set fairly slow  irrespective of the Speed of the device that you have. Moving the sliders to the  right increases speed. You can change the speeds as follows: </p>\r\n<ul>\r\n  <li><strong>Dealer - </strong>This  option sets the speed at which the dealer deals cards.</li>\r\n  <li><strong>Other Players - </strong>This  option sets the speed at which the other players make decisions.</li>\r\n  <li><strong>Payoffs - </strong>This  option sets the speed at which the dealer resolves bets at the end of the  round.</li>\r\n</ul>\r\n<h3>Mechanics</h3>\r\n<ul>\r\n  <li><strong>Sound On - </strong>Turn  off to remove sounds. </li>\r\n  <li><strong>Use a quieter sound  for errors</strong> - Use a beep instead of the annoying buzzer. Frankly, if  you are making errors you should probably keep the annoying buzzer.</li>\r\n  <li><strong>Refresh bankroll at  startup </strong>- Reset the bankroll to the value on the setup screen each  time you start play.</li>\r\n  <li><strong>Log errors </strong>-  Log each error you make. To see the log, tap on Stats, then tap on Error Logs</li>\r\n  <li><strong>Auto</strong>-<strong>delete</strong> logs - Delete the log each time you start the app to keep from using up memory.</li>\r\n  <li><strong>Hide buttons</strong> - Remove hit/stand/double, etc. buttons from the screen and use only gestures.</li>\r\n  <li><strong>Hide cards in  discard tray </strong>- Some casinos now hide the discards. This feature  allows practice without the benefit of a discard tray.</li>\r\n  <li><strong>Hide Shoe </strong>-  Likewise, the shoe can be removed.</li>\r\n  <li><strong>Players come and go - </strong>This option means that, occasionally, other players will appear or  leave. This is one of the more annoying distractions in a real casino,  particularly for a car counter. </li>\r\n</ul>","frmOpts5.htm":"<h2>Dealer Errors/Biases</h2>\r\n\r\n<h3>Biases</h3>\r\n<p>Drills are very useful for practicing one aspect of BJ at a time.  The game is good for practicing all aspects at once. The problem is that random  play does not present you with difficult situations very often. Most of your  time is wasted playing easy hands. The point of these options is to make better  use of your practice time. The Bias options can be used to greatly increase the  difficulty of play by forcing more difficult situations as follows:</p>\r\n<ul>\r\n  <li><strong>No Bias</strong> -  Cards are dealt randomly.</li>\r\n  <li><strong>Positive Counts</strong> - Only for card counters, when set, the dealer will deal more cards with  positive counts early in the shoe. This forces a counter to count high counts  and then to count positive numbers downward in the second half of the shoe.</li>\r\n  <li><strong>Negative Counts</strong> - When set, the dealer will deal more cards with negative counts early in the  shoe. This forces a counter to count large negative numbers and then to count  negative numbers upward in the second half of the shoe. </li>\r\n  <li><strong>Many Card Hands - </strong>Many  people find lengthy hands difficult, particularly with multiple aces. It is  even more difficult for card counters. When set, the dealer will deal more  small cards forcing you to count both the hand value and card count at the same  time. </li>\r\n  <li><strong>Repeat Errors - </strong>If  this option is set, playing errors will be tracked and the dealer is more  likely to deal hands that you have not handled correctly in the past.</li>\r\n  <li><strong>Difficult Hands - </strong>When  set, the dealer increases the number of hands with close decisions.</li>\r\n</ul>\r\n<h3>Dealer Errors</h3>\r\n<p>This is another attempt at  casino realism and is important particularly in newer casinos. Players tend to  trust the dealer. If you do not catch dealer errors you may lose a significant  portion of your edge. When set, on occasion the dealer will make an error. The  amount is not wrong (except when Blackjack payoff errors is set.) However,  sometimes the dealer will not pay on a close winning hand, will not pay  Insurance, will bust an un-busted hand, will bust your many card 21, will stand  on a many card 16 or not bust himself on a many card 22 or will not pay a bonus  or side bet. A button appears on the betting screen labeled FOUL. Tap on it if  you think that you saw an error during the last round. If you miss an error, at  the beginning of the next hand, you will be notified and shown the error. You  can set the types of errors the dealer can make.</p>\r\n","frmOpts6.htm":"<h2>Bonuses</h2>\r\n\r\n<p>This screen lists the more common bonuses. Generally, these  bonuses are related to Blackjack, card combinations or lengthy hands. Blackjacks  often result in a half dollar as a part of the payoff. At a few casinos, the  dealer will round the payoff up to the next dollar instead of bothering with  coins. Use the Blackjack� rounded up  option to simulate this.</p>\r\n","frmOpts7.htm":"<h2>Play Variations</h2>\r\n\r\n<ul>\r\n  <li><strong>Dealer makes obvious  plays</strong> - You will find that some dealers will not wait for you to  signal a hit or stand if you are a good player and the play is obvious. This  option will cause the dealer to play for you in these situations to speed the  game. </li>\r\n  <li><strong>Dealer points out  stupid plays - </strong>In most casinos, if you do something very odd (e.g.  double down on a hard 18), the dealer will ask you if you really wanted to take  this action. This option adds realism and can be used to avoid misplays.</li>\r\n  <li><strong>Insure then  Surrender allowed</strong> - In some situations, depending on the options set  above, you may want to insure a hand and then Surrender the same hand. In a  casino, this can cause some interesting conversations with the dealer or pit  boss. Casinos will often argue that a hand that has been insured cannot be  surrendered because it no longer exists. You might argue that Insurance is  purely a side bet. </li>\r\n  <li><strong>Dealer shows burn  cards</strong> - Some casinos discard (burn)  one to five cards off the top of the deck after shuffling. With this option on,  the cards are shown. Otherwise, the hands are discarded face down. This option  is only of interest to card counters.</li>\r\n  <li><strong>Dealer peeks on 10</strong> - With  this option, the dealer will peek at the down card to check for Blackjack when  the dealer up card is a ten. This option is becoming more common as newly  developed optical devices for peeking at the down card are being installed on  casino tables.</li>\r\n  <li><strong>Dealer peeks on Ace</strong> - Normally, the dealer will peek at the down card when an Ace is showing, as  there is a good chance that a Blackjack exists. Some casinos do not check to  prevent cheating. </li>\r\n  <li><strong>Dealer wins tied 17</strong> - This awful option causes tied 17 hands to be lost instead of pushed.</li>\r\n  <li><strong>Dealer wins ties</strong> - With this option, you lose your bet on a tied hand. This awful option  sometimes is added to counteract another unusual option that heavily favors the  player.</li>\r\n  <li><strong>Five cards unbusted  wins</strong> - With this option, the player always wins when five cards have  been drawn without busting. </li>\r\n  <li><strong>Six cards unbusted  wins</strong> - With this option, the player always wins when six cards have  been drawn without busting. </li>\r\n  <li><strong>Seven cards unbusted  wins</strong> - With this option, the player always wins when seven cards  have been drawn without busting. </li>\r\n  <li><strong>Player 22 counts as  21</strong> - When set, the player does not bust with a total of 22.</li>\r\n  <li><strong>Dealer wins tied 17,  18 and 19</strong> - This awful option causes tied 17, 18 and 19 hands to be  lost instead of pushed. This lousy rule exists in Swedish casinos.</li>\r\n</ul>","frmOpts8.htm":"<h2>Common Rules</h2>\r\n<ul>\r\n  <li><strong>Cards  dealt face down</strong> - Most casinos deal cards face up with six of eight  decks and face down with one or two decks; but there are exceptions to both.  Tap to change.</li>\r\n  <li> <strong>Double down after split</strong> -  Selecting this option allows doubling down on hands that have been created by  splitting a pair. This is common in Atlantic City, available in Las Vegas and  available at about 30% of the world's casinos. This rule has an advantage of  .12-.14%. Most strategies are affected by this rule and the related strategy  tables will automatically be updated when this option is changed.</li>\r\n  <li> <strong>Dealer hits soft 17</strong> -  With this option, the dealer will hit a soft 17 (e.g. Ace, 6 or Ace, 3, 3).  With the option off, the dealer stands. This option is common in downtown Las  Vegas, nearly all single deck games and at about 50% of the world's casinos. It  substantially lowers the player's advantage as he is less likely to bust, and  is one of the more important options. The rule adds .2% or more to the house  advantage. Unfortunately, it is becoming more common in Las Vegas, particularly  at cheaper tables. Note: Changing this option automatically changes the  strategy tables in effect.</li>\r\n  <li> <strong>No  dealer hole card </strong>- With this option, seen in most casinos outside  the U.S., the dealer does not receive a second card until after the players  have played their hands. With this option, the dealer cannot peek to check for  Blackjack. Note: In most casinos with this rule, the dealer takes all Double Down  and Split bets when he has a Blackjack. In this case, you should also set the  Dealer Blackjack wins all option below.</li>\r\n  <li> <strong>Dealer Blackjack wins all</strong> - This option worsens the players' odds. If the dealer does not peek and then  discovers a dealer Blackjack after all players have  played, all player split hands and double down bets lose when this option is  on. When the option is off, splits and double downs are considered as never  having occurred and the player retains the bets. This rule is rare in the U.S.  The rule adds about .09% to the house advantage depending on the other rules.</li>\r\n  <li> <strong>Hard Doubles</strong> - Select from the combo box the  hands where doubling is allowed. In Las Vegas, you can usually double on any  hard hand. Single deck games often limit doubles to hands totaling 10 or 11,  particularly in Reno. Many non-U.S. casinos also limit doubles. The increase in  house advantage for Double on 10 and 11 only is about .45-.52%. Adding Double  on 9 reduces house advantage by .08-.13%. Note: There are many additional  Double Down options on the Rule Variations screen.</li>\r\n  <li> <strong>Soft Doubles</strong> - Select  from the combo box the hands where soft doubling is allowed. In Las Vegas, you  can usually double on any soft hand. Most single deck games and many non-U.S.  casinos do not allow soft doubles at all. The increase in house advantage for  no soft doubles� is about .08-.13%.</li>\r\n  <li><strong>Insurance - </strong>This nearly  universal option allows an insurance bet against a dealer face up  Ace. Some casinos in Europe allow insurance bets only when the player has a  Blackjack. </li>\r\n  <li><strong>Late Surrender</strong> - The  common form of surrender is allowed by setting this option. The player can  Surrender a hand (throw it in) for half of the bet after the dealer has checked  for Blackjack. If the dealer is not allowed to peek and does not know if there  is a dealer Blackjack (see peek options) then a Surrender chip is placed on  your bet and the Surrender occurs only after the dealer checks for Blackjack  and finds that it does not exist.</li>\r\n  <li> <strong>Early Surrender - </strong>This  less and less available option allows Surrender of a hand before the dealer  checks for Blackjack. If you can find a casino that allows it, this is one of  the most valuable options in the game. A few casinos in Vancouver, Africa,  Russia, Eastern Europe and France offer the rule. Advantage is about .6-.7%.</li>\r\n  <li> <strong>Early Surrender vs. 10</strong> -  This option is the same as Late Surrender, except that you can also Surrender  against a dealer up card of ten even if the dealer has a Blackjack.</li>\r\n  <li> <strong>Macao Surrender</strong> - This,  currently obsolete, rule allows Surrender of an unbusted hand with five cards.</li>\r\n  <li> <strong>Limits</strong> - Set the table limits. Your bets will be  required to fall within these limits.</li>\r\n</ul>","frmOpts9.htm":"<h2>Peeking</h2>\r\n<ul>\r\n  <li><strong>Peek  at dealer down card </strong>- With this  option, the dealer down card flashes on the screen for a half second. You will  occasionally find that you can see the dealer down card as it is dealt. Obviously,  this improves the odds enormously. The number to the right is the percentage of  times this will occur.</li>\r\n  <li><strong>Peek  when dealer peeks</strong> - Peek at the  dealer down card as above; but only when the dealer checks for a Blackjack. The  number to the right is the percentage of times this will occur.</li>\r\n  <li><strong>Peek  right and left</strong> - These options allow  peeking at and counting of the cards of players next to you when you are  playing a face cards dealt down game.</li>\r\n  <li><strong>Randomize  Card</strong> - When set, you can peek at  random cards instead of both cards at your right or left according to the above  option.</li>\r\n  <li><strong>Randomize  Hand</strong> - When set, you can randomly  peek at hands to your right or left. These options complicate card counting, as  you need to remember if you counted the cards.</li>\r\n  <li><strong>Hole  Carding </strong>- When you see the dealer  down card, the strategy is completely different, and substantially more complex  than normal Blackjack strategies. Your decision must be made depending on both  dealer cards. So, the tables are over twice as large. For cover purposes, you  may also want to play differently depending on whether the dealer upcard is a  high card (7 and up) or low card. Altogether, three playing strategies can be  specified. Specify the strategy to be used when you do not see the hole card on  the Playing Strategies screen. Normally, this is Basic Strategy. Specify one or  two strategies on this screen to be used when you see the card. Both strategies  can be the same. A sample strategy has been included which includes some cover.  That is, it doesn&rsquo;t allow suspicious plays like hitting a 19 against a 20. You  will be checked against these strategies. You can define and import a custom  strategy from Casino Verite Windows software. Import from the Playing  Strategies screen and then select here. Note: Errors for hole-carding are not  logged. Also, because the strategy tables are very large, you will need to  rotate to landscape when viewing them on a small device.</li>\r\n</ul>\r\n<h2>&nbsp;</h2>","frmStats.htm":"<h2>Stats</h2>\r\n<h3>Statistics table</h3>\r\n<p>A bunch of statistics are display in a five-section table as  follows:<br />\r\n  <strong>Counts</strong> - For card counters, the remaining decks and  counts are displayed. Bet count is only displayed if you are side-counting  aces. Ten count is only displayed if you are side-counting tens.<br />\r\n  <strong>Bankroll </strong>- Here, stats related to your bankroll and betting are supplied.<br />\r\n  <strong>Errors </strong>- Summaries of errors that you have made.<br />\r\n  <strong>Tray </strong>- The contents of the discard tray, including burn cards.<br />\r\n  <strong>Shoe </strong>- The cads remaining in the shoe.</p>\r\n<h3>Display Options</h3>\r\n<p>These are not available on smaller phones. On larger phones,  you may nee to rotate to landscape to see these options. You can display your  play and betting accuracy, and/or current running and true counts on the table  as you play by selecting these options.</p>\r\n<h3>Reset Stats</h3>\r\n<p>Zero the stats.</p>\r\n<h3>Display Logs</h3>\r\n<p>Display the error logs.</p>\r\n<p>&nbsp;</p>","frmStrats.htm":"<h2>Playing Strategies</h2>\r\n\r\n<p>Strategy<br />\r\n  If you are not card counting, select Basic Strategy. You will  also need to set the rules. If you are counting, you will need to select from  the numerous strategies or import your own custom strategy. Strategies include  the full index tables from the respective books, with permission of every  author.<br />\r\n  Indices<br />\r\n  This is used only for card counters.</p>\r\n<ul>\r\n  <li><strong>All indices</strong> - All indices in the tables will be used.</li>\r\n  <li><strong>Illustrious 18</strong> - When set, only the most important indices will be used. The Illustrious 18 is  a set of situations which expert, Don Schlesinger, determined are of the highest  value in playing BJ. </li>\r\n  <li><strong>Sweet 16 </strong>-  This option removes ten-splitting indices, not commonly used by counters.</li>\r\n  <li><strong>Catch 20 </strong>-  Four indices added to replace the ten-split indices.</li>\r\n  <li><strong>No indices </strong>-  Use basic strategy for play.</li>\r\n  <li><strong>Custom</strong> -  You can also set a Mask by tapping on the Select button. This provides the  ability to specify exactly which indices you wish to use and allows you to  easily change them. </li>\r\n</ul>\r\n<p><strong>Index Range</strong><br />\r\nYou can also limit the range of indices used.</p>\r\n<p><strong>Rules</strong><br />\r\n  Selecting any of the rules will alter the strategies  accordingly. Also select Warning on Strategy Error if you want warnings.</p>\r\n<p><strong>Adjust IRC</strong><br />\r\n  By selecting this option and specifying a number, you can force  the pivot to a specified number for unbalanced strategies like KO. All indices  will be adjusted.</p>\r\n<p><strong>Import Strategy</strong><br />\r\n  Strategies supported by BJV can be very complex. For example,  the Spanish 21 strategy, supplied by the Wizard of Odds, has rules like Hit if  five or more cards or a 678 is possible. Strategies can also include separate  tables for different rules. Inputting a complex strategy on a touchscreen would  be extremely difficult. So, a feature has been added to import strategies from  Casino Verite Blackjack. This provides the ability to create a complex strategy  on a PC and download it to your mobile device. If you do not have a CV  Blackjack license, you can use the free demo at <a href=\"http://www.qfit.com/downloads.htm\">www.qfit.com/downloads.htm</a>. The  strategy creation and export functions work in the demo.<br />\r\n  To Export a strategy in CV Blackjack, tap on Strategies then  Playing Strategies Simple. Select a strategy. Then hit Export Strategy. (If the  button is not there, download the latest update.) You will be presented with a  number. Enter the number in the Import Strategy screen and tap Import. Tap Exit,  then Select a Strategy, and you will see your strategy in the list. Multiple  strategies can be imported.<br />\r\n  </p>\r\n<p><strong>Display Tables</strong><br />\r\n  Tap to display the selected strategy according to the settings  on this screen.</p>\r\n","frmtabhn.htm":"<h2>Tables</h2>\r\n\r\n<p>This screen can be entered from several places and looks a  bit different depending on why it is displayed. In all cases, one of the  strategy tables is displayed with the player hand at the left and dealer card  at the top. A key at the bottom left indicates the meanings of the colors. If  you are displaying a strategy, you can select a table from the selection  control at the upper-right. If you have made a Flashcard Drill error, the  tested hand will blink. The action you took and the correct action will be displayed  at the top. If there are specialty plays, as in the Spanish 21 strategy, a list  of the plays will be provide at the bottom-right. If you are creating a custom  index test, the table will be grayed out. Tap on a cell to select a hand to be  tested. Tap again to remove a hand. </p>\r\n","frmTable.htm":"<h2>Play of the Game</h2>\r\n\r\n<h3>The screen</h3>\r\n<p>The game can be played in landscape or portrait on a tablet -  portrait only on a phone. Landscape provides a more accurate representation of  a casino Blackjack table and more seats. Portrait provides larger cards.<br />\r\n  Unless you have turned off the option, a discard tray appears  at the upper-left. It is animated to show the number of cards in the tray. As  cards are removed from the table, the number of cards in the tray increases. In  landscape mode, a shoe, also animated, is displayed at the upper-right. One to  six seats are displayed at the bottom with semicircles. Seats that you have set  for the player will display $0 at the start. Seats the computer uses will show  no values. Your bankroll is at the center near the top. It can go negative.  That is, you can borrow money from the casino.<br />\r\n  The Stats button will display statistics. It cannot be tapped  while the game is animating. That is, dealing or making payoffs. The Error  button will display the strategy table related to the last error that you made,  with information about the error and the violation in the table blinking.<br />\r\n  If you have opted to see counts and error rates on the Stats  screen, they will appear at the upper-middle.</p>\r\n<h3>Betting</h3>\r\n<p>When it is time to bet, a bet selection overlay will appear  above the table on a Plexiglas platform. Tap on one of the values to make a  bet. Or, tap on one of the buttons as follows:</p>\r\n<ul>\r\n  <li><strong>Customize</strong> - Tap to change the values in the betting table.</li>\r\n  <li><strong>Last  Error </strong>- Tap to display details of the last error.</li>\r\n  <li><strong>Foul </strong>- If you have set the dealer error options, and you saw a dealer  error in the previous round, tap the Foul button. The payoff will be corrected.  If you make a bet and did not see the error, you will receive a warning telling  you what you missed.</li>\r\n  <li><strong>Side  Bet </strong>- If you are playing a game that has side bets, tap this button  to display the table of side bets. Make a side bet, and the main bet table will  again be displayed. Tap your main bet and both the side bet and main bet will  be placed. If the main bet is for multiple hands, the side bet will also be  made for multiple hands.</li>\r\n  <li> <strong>Reset  Bank </strong>- Reset your bankroll to the starting value.</li>\r\n  <li><strong>Shuffle </strong>- Force a shuffle.</li>\r\n</ul>\r\n<h3>The Play</h3>\r\n<p>Once you have made your bet, the dealer will start dealing. If  you have set the options to include other players, they will also receive  cards. When it is time for a play, a pointer will appear showing the hand that  is currently in play. You can make decisions by tapping buttons, or making  gestures as follows:</p>\r\n<ul>\r\n  <li>  Hit: swipe down  (give me a card)</li>\r\n  <li> Stand: swipe left  (the old signal for pass to the next player)</li>\r\n  <li> Double: swipe up:  (put up more chips)</li>\r\n  <li> Split: swipe right  (separate into two hands)</li>\r\n  <li> Surrender, any  diagonal swipe (cross out the hand)</li>\r\n  <li> Insurance: swipe  down</li>\r\n  <li> Pass (no insurance):  swipe left</li>\r\n  <li> The button icons  give clues as to the gestures.</li>\r\n</ul>\r\n<h3>Hand Resolution</h3>\r\n<p>Once you stand, the other  players will play and the dealer will complete her hand. Then, one at a time,  the dealer will handle payoffs. You will see signs indicating wins, losses,  bonuses, etc., and the amounts in the seat boxes will change. They will then be  zeroed and the amounts moved to the bankroll if you have won. Blackjacks are  resolved immediately (unless the dealer has an ace and does not peek). Side  bets are usually resolved before the play.�  There are various exceptions according to the rule settings. After  everything is resolved, you will go back to betting.</p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>","frmTC.htm":"<h2>True Count Calculations</h2>\r\n\r\n<h3>True Count Resolution</h3>\r\n  <p>These options are used only in card counting systems in which a  running count is converted to a true count. The options vary the exactness of  the division. <strong>Important</strong>: This is not the same as the True Count Divisor.  The divisor is set in the strategy itself.</p>\r\n  <ul>\r\n    <li><strong>Full Deck </strong>- This option is only meaningful if  your counting system true count conversion is in full decks. If it is in half  decks and this option is set, the Half Deck option below will be used. The  option means that you will estimate the remaining decks in terms of full decks  and always divide by a whole number.</li>\r\n    <li> <strong>Half Deck</strong> - When set, the running count divisor  will be the remaining decks (or half decks if specified by your system) to the  nearest half deck. This requires a better estimate of the remaining decks.</li>\r\n    <li> <strong>Quarter Deck</strong> - This is quite difficult with many  decks remaining. When set, you must estimate the remaining decks to the closest  number of quarter decks.</li>\r\n    <li> <strong>Exact Calculation</strong> - The True Count is calculated  to the card.</li>\r\n  </ul>\r\n  <h3>    Last Deck Resolution<br />\r\n  </h3>\r\n  <p>It is easier and more important to estimate the remaining decks  when you are in the last deck of a shoe (when you are lucky enough to find a  casino that deals that far.) This option allows you to force a better estimate  during the last deck.\r\n  </p>\r\n  </p>\r\n<h3>True Count Division</h3>\r\n<ul>\r\n  <li> <strong>Round</strong> - After the True Count division, the result  is rounded to the nearest integer.</li>\r\n  <li> <strong>Truncate</strong> - For positive numbers, round down and  for negative numbers round up.</li>\r\n  <li> <strong>Floor</strong> - Fractions are always removed.</li>\r\n</ul>\r\n<h3>Allowed estimation error</h3>\r\n<p>If you estimate the deck depth slightly incorrectly, it can change  your true count and change a playing decision. But, the error is very minor.  This feature can be used to set the number of cards of inaccuracy allowed. If  you are off by this many cards or fewer and it causes a misplay, you will  receive a close call warning instead of an error. The hand will not be marked  in the error hands since you probably know how to play the hand.</p>\r\n<h3>Side Counts (expert play)</h3>\r\n<ul>\r\n  <li><strong>Ace Side Count</strong> - In addition to any other counts, you can set this option to side count Aces  to improve playing betting counts. </li>\r\n  <li><strong>Ten Side Count</strong> - In addition to any other counts, you can set this option to side count Tens  versus non-Tens for a perfect Insurance Count. </li>\r\n</ul>","frmView.htm":"<h2>Error Logs</h2>\r\n<p>Click on the Errors buttons on any of the drills screens to reach this screen. A list of the last 200 errors for that drill will be displayed, most recent first. The last column will contain the word View. Click this to examine the error.</p>\r\n<h3>Delete All</h3>\r\n<p>Click this button to erase all error logs and start anew.</p>\r\n<h3>Oldest First</h3>\r\n<p>Select to reverse the display order</p>\r\n<h3>View Counts</h3>\r\n<p>This button is only on the Counts Drill error log. It will take you to another screen that will display the counts of the hands that have given you problems.</p>"};</script>
